image: ""
replicaCount: 3

configmap:
  data:
    POSTGRES_DB: library
    POSTGRES_USER: library

postgres:
  image: postgres:16-alpine
  storageClass: local-path
  storageSize: 5Gi

services:
  web:
    nodePort: 30080
  postgres:
    nodePort: 30432

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
