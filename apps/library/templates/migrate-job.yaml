apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "library.migrateName" . }}
  labels:
    {{- include "library.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        {{- include "library.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: {{ .Values.image | quote }}
          imagePullPolicy: Always
          command: ["sh", "-c", "flask --app wsgi db upgrade && flask --app wsgi seed-books"]
          env:
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "library.secretsName" . }}, key: SECRET_KEY}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "library.secretsName" . }}, key: POSTGRES_PASSWORD}}
            - name: DATABASE_URL
              value: postgresql+psycopg://library:$(POSTGRES_PASSWORD)@{{ include "library.postgresName" . }}:5432/library
