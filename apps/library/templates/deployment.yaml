apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: {{ include "library.appName" . }}
  labels:
    {{- include "library.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: flask-webapp
  template:
    metadata:
      labels:
        app: flask-webapp
    spec:
      imagePullSecrets:
        - name: {{ include "library.pullSecretName" . }}
      containers:
        - name: web
          image: {{ .Values.image | quote }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "library.secretsName" . }}, key: SECRET_KEY}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "library.secretsName" . }}, key: POSTGRES_PASSWORD}}
            - name: DATABASE_URL
              value: postgresql+psycopg://library:$(POSTGRES_PASSWORD)@{{ include "library.postgresName" . }}:5432/library
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "library.appName" . }}
  labels:
    {{- include "library.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: flask-webapp
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.services.web.nodePort }}
