apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: library
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MarwanULQ/k8-2-gitops.git
    targetRevision: main
    path: apps/library
    helm:
      releaseName: library
      valueFiles:
        - ../../environments/cluster/library.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: library
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      enabled: true